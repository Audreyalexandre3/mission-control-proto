<style>
  /* Layout only. Visual components are DS CSS-UI classes (.ap-*). Borders we author use grey-20 (house rule). */
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--ref-color-grey-bg); color:var(--ref-color-grey-100); font-family:var(--ref-font-family); font-size:var(--ref-font-size-sm); -webkit-font-smoothing:antialiased; }

  .muted { color:var(--ref-color-grey-80); }
  .xs { font-size:var(--ref-font-size-xs); line-height:var(--ref-font-line-height-xs); }
  .b { font-weight:var(--ref-font-weight-bold); }
  .row { display:flex; align-items:center; gap:var(--ref-spacing-xxs); }

  .navitem.active { background:var(--ref-color-electric-blue-10); color:var(--ref-color-electric-blue-100); font-weight:var(--ref-font-weight-bold); }
  .navitem .ap-counter { margin-left:auto; }
  .navitem.dim { color:var(--ref-color-grey-80); }
  .nav .grow { flex:1; }

  /* main */
  .main { display:flex; flex-direction:column; min-width:0; height:100vh; }
  .head { display:flex; align-items:center; gap:var(--ref-spacing-xs); height:64px; padding:0 var(--ref-spacing-md); background:var(--ref-color-white); border-bottom:1px solid var(--ref-color-grey-20); flex-shrink:0; position:relative; }

  .scroll { position:relative; flex:1; overflow:auto; padding:var(--ref-spacing-lg) var(--ref-spacing-md) 120px; }
  .wrap { max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:var(--ref-spacing-md); }

  .menu { position:absolute; top:56px; right:var(--ref-spacing-md); width:380px; z-index:50; padding:var(--ref-spacing-xxs); }

  .menu-foot { display:flex; align-items:center; justify-content:space-between; padding:10px 12px 6px; }

  .ap-card.pad { padding:var(--ref-spacing-md); display:flex; flex-direction:column; gap:var(--ref-spacing-sm); }
  .sec-head { display:flex; align-items:center; gap:var(--ref-spacing-xs); }
  .sec-head p { margin-top:2px; }

  /* home */

  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--ref-spacing-sm); }
  .tile { background:var(--ref-color-white); border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:var(--ref-spacing-sm); }

  .dec { padding:var(--ref-spacing-md); display:flex; flex-direction:column; gap:var(--ref-spacing-xs); }

  .dec-meta { display:flex; align-items:center; gap:var(--ref-spacing-xxs); flex-wrap:wrap; }

  .draft { border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:10px 12px; }

  .blocked { display:flex; align-items:center; gap:6px; }
  .uc { display:none; }

  .ap-table { width:100%; }

  .ap-table th { text-align:left; font-weight:var(--ref-font-weight-bold); color:var(--ref-color-grey-80); font-size:var(--ref-font-size-xs); padding:8px 12px; border-bottom:1px solid var(--ref-color-grey-20); }
  .ap-table td { padding:10px 12px; vertical-align:middle; }
  .ag-name { display:flex; align-items:center; gap:10px; }
  .ag-ico { width:32px; height:32px; border-radius:var(--ref-border-radius-md); background:var(--ref-color-grey-05); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .kv { display:grid; grid-template-columns:160px 1fr; gap:10px 16px; align-items:start; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tags .ap-tag, .tags .ap-tag > span { max-width:none; overflow:visible; text-overflow:clip; }
  .auto-table td.c, .auto-table th.c { text-align:center; }
  .auto-table .ap-radio-container { justify-content:center; display:inline-flex; }
  .lvl-legend { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .lvl-legend div { border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:8px 10px; }

  /* playbook */
  .rule { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--ref-color-grey-20); }
  .rule:first-child { border-top:0; }
  .rule .t { flex:1; }

  /* guardrails */
  .switch-row { display:flex; align-items:center; gap:var(--ref-spacing-xs); padding:10px 0; border-top:1px solid var(--ref-color-grey-20); }
  .switch-row:first-child { border-top:0; }
  .bar { height:8px; background:var(--ref-color-grey-10); border-radius:8px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--ref-color-orange-100); }

  /* empty state */
  .empty { text-align:center; padding:var(--ref-spacing-xl) var(--ref-spacing-md); display:flex; flex-direction:column; align-items:center; gap:var(--ref-spacing-xs); }
  .empty .ico { width:56px; height:56px; border-radius:50%; background:var(--ref-color-grey-05); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ref-color-grey-80); }
  .empty p { max-width:460px; }

  .snack { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:80; }
  .proto-tag { margin-left:auto; }
  @media (max-width:1100px){ .tiles{grid-template-columns:repeat(2,1fr);} .two{grid-template-columns:1fr;} }
</style>

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = () => ROLES[S.who];
const initials = n => n.split(' ').map(x=>x[0]).slice(0,2).join('');
const person = (n, size=24) => `<span class="ap-avatar size-${size}"><span class="ap-avatar-initials">${initials(n)}</span></span>`;
const profAv = (pid, size=32) => { const p=PROFILES[pid]; return `<span class="ap-avatar size-${size}"><span class="ap-avatar-initials">${CLIENTS[p.client].name[0]}</span>${size>=32?`<span class="ap-avatar-network"><i class="ap-icon-${p.net}"></i></span>`:''}</span>`; };
const clientOf = d => PROFILES[d.profile].client;
const modOf = d => agentById(d.agent).module;
const sees = client => R().clients.includes(client);
const visibleDecisions = () => S.decisions.filter(d => sees(clientOf(d)) && (R().modules.includes(modOf(d)) || R().modules.length===0));
const canDecide = d => R().modules.includes(modOf(d)) && (!d.need || R()[d.need]);
const visibleAgents = () => AGENTS.filter(a => sees(a.client));
const URG = { high:['red','Urgent'], med:['orange','Today'], low:['grey','When you can'] };
const agentLabel = a => `${a.name} · ${CLIENTS[a.client].name}`;

function snack(text, undoFn){
  $('snackText').textContent = text;
  $('snackRight').innerHTML = undoFn ? `<button id="snackUndo">Undo</button>` : '';
  $('snack').hidden = false;
  if(undoFn) $('snackUndo').onclick = () => { undoFn(); $('snack').hidden = true; };
  clearTimeout(snack.t); snack.t = setTimeout(()=>$('snack').hidden=true, undoFn?6000:2600);
}
function now(){ const d=new Date(); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function addLog(e){ S.log.unshift({t:now(), ...e}); }

/* ---------------- role menu ---------------- */

    + `<div class="ap-action-dropdown-divider"></div>

document.addEventListener('click', e => { if(!$('whoMenu').contains(e.target)) $('whoMenu').hidden = true; });
$('whoMenu').addEventListener('click', e => {

  if(it){ S.who = it.dataset.who; S.agent=null; S.tab='all'; S.pb = R().clients[0] || 'lune'; $('whoMenu').hidden=true; render(); snack('Now viewing as '+R().name+' · '+R().role); }

/* ---------------- nav ---------------- */
$('nav').addEventListener('click', e => {

/* ---------------- views ---------------- */
const TITLES = { home:'Home', decisions:'Decisions', agents:'Agents', playbook:'Playbook', activity:'Activity', guardrails:'Guardrails' };

function render(){
  renderWho();
  const ext = R().external;
  document.querySelectorAll('.navitem[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===S.view && !ext));

}

}

    <div class="tile"><div class="muted xs">Waiting for you</div><div class="v">${mine.length}</div><div class="muted xs">${vis.length-mine.length ? (vis.length-mine.length)+' more need someone else' : 'decisions'}</div></div>
    <div class="tile"><div class="muted xs">Time saved this week</div><div class="v">${(6.7*scale).toFixed(1).replace('.0','')} h</div><div class="muted xs">based on average reply time</div></div>

function statusTag(a){
  const paused = a.status==='paused' || S.paused.all || S.paused[a.client];

/* --- decisions --- */
function viewDecisions(){
  const vis = visibleDecisions();
  const mods = ['all', ...Object.keys(MODULES).filter(m=>vis.some(d=>modOf(d)===m))];
  if(!mods.includes(S.tab)) S.tab='all';
  const list = vis.filter(d => S.tab==='all' || modOf(d)===S.tab)
    .sort((a,b)=>'hml'.indexOf(a.urgency[0])-'hml'.indexOf(b.urgency[0]));
  const readOnly = R().modules.length===0;
  return `
  ${readOnly ? `<div class="ap-infobox info"><i class="ap-icon-info"></i><div class="ap-infobox-content"><div class="ap-infobox-texts"><span class="ap-infobox-message">You have read-only access. You can follow decisions, not approve them.</span></div></div></div>` : ''}
  <div class="filters"><div class="ap-tabs"><div class="ap-tabs-nav" role="tablist">${mods.map(m=>{ const n = vis.filter(d=>m==='all'||modOf(d)===m).length;
      return `<button class="ap-tabs-tab${m===S.tab?' active':''}" data-tab="${m}">${m==='all'?'All':MODULES[m]}<span class="ap-counter normal ${m===S.tab?'blue':'grey'}">${n}</span></button>`; }).join('')}</div></div></div>
  ${list.length ? list.map(decCard).join('') : `<div class="ap-card"><div class="empty"><div class="ico"><i class="ap-icon-rounded-check"></i></div><h2 class="ap-h3">All caught up</h2><p class="muted">Your agents will bring new decisions here. Everything they did alone is in Activity.</p><button class="ap-button primary blue" data-go="activity"><span>See activity</span></button></div></div>`}`;
}

function decCard(d){
  const a = agentById(d.agent), [uc,ul] = URG[d.urgency], p = PROFILES[d.profile];
  const can = canDecide(d), hasModule = R().modules.includes(modOf(d));
  let foot;
  if(S.rejecting[d.id]){
    foot = `<div class="reasons"><span class="muted">Why reject?</span>${['Wrong tone','Wrong information','Not needed','Other'].map(r=>`<span class="ap-tag grey" data-reject-reason="${d.id}" data-r="${r}"><span>${r}</span></span>`).join('')}
      <span class="spacer"></span><button class="ap-button ghost grey" data-cancel-reject="${d.id}"><span>Cancel</span></button></div>`;
  } else if(S.editing[d.id]){
    foot = `<div class="acts"><button class="ap-button stroked grey" data-cancel-edit="${d.id}"><span>Cancel</span></button><button class="ap-button primary blue" data-approve="${d.id}" data-edited="1"><span>Save and ${d.approve.toLowerCase()}</span></button></div>`;
  } else if(can){
    foot = `<div class="acts">
      <button class="ap-button stroked grey" data-reject="${d.id}"><i class="ap-icon-thumb-down"></i><span>Reject</span></button>
      ${d.editable||d.draft&&!d.need ? `<button class="ap-button stroked grey" data-edit="${d.id}"><i class="ap-icon-pen"></i><span>Edit</span></button>` : ''}
      ${d.secondary ? `<button class="ap-button stroked grey" data-secondary="${d.id}"><span>${d.secondary}</span></button>` : ''}
      <button class="ap-button primary blue" data-approve="${d.id}"><i class="ap-icon-check"></i><span>${d.approve}</span></button></div>`;
  } else if(hasModule && d.fallback){
    foot = `<span class="blocked muted xs"><i class="ap-icon-lock-on"></i>Only an admin can ${d.need==='grantAuto'?'let an agent act alone':'change the playbook'}.</span>
      <div class="acts"><button class="ap-button stroked grey" data-fallback="${d.id}"><span>${d.fallback}</span></button></div>`;
  } else {
    foot = `<span class="blocked muted xs"><i class="ap-icon-lock-on"></i>${R().modules.length ? 'You don\'t have '+MODULES[modOf(d)]+' rights on this profile.' : 'Read-only access.'} Someone with access will decide.</span>`;
  }
  const draftBlock = S.editing[d.id]
    ? `<div class="ap-textarea-field autoresize"><label>Suggested ${d.list?'posts':'reply'}</label><textarea id="ed-${d.id}" rows="3">${esc(d.draft || (d.list||[]).join('\n'))}</textarea></div>`
    : d.draft ? `<div class="draft"><div class="lbl muted xs b">${d.kind==='Autonomy'||d.kind==='New rule'||d.kind==='Insight' ? 'Proposed change' : 'Suggested reply'}</div><div>${esc(d.draft)}</div></div>`
    : d.list ? `<div class="draft"><div class="lbl muted xs b">Proposal</div><ul>${d.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  return `<article class="ap-card dec" id="card-${d.id}">
    <div class="dec-meta"><span class="ap-status ${uc}">${ul}</span><span class="b">${d.kind}</span><span class="sep">·</span>
      ${profAv(d.profile,24)}<span>${CLIENTS[p.client].name} ${p.handle.startsWith('@')?p.handle:''}</span><span class="sep">·</span>
      <span class="muted">${a.name}</span><span class="spacer"></span><span class="ap-tag grey mini uc"><span>${d.uc}</span></span></div>
    <h3>${esc(d.title)}</h3>
    <div class="muted">${esc(d.context)}</div>
    ${d.quote ? `<div class="quote">${esc(d.quote)}</div>` : ''}
    ${draftBlock}
    ${d.extra ? `<div class="row xs"><i class="ap-icon-pause"></i><span>${esc(d.extra)}</span></div>` : ''}
    ${S.openWhy[d.id] ? `<div class="why"><span class="b xs">Why this proposal</span><span>${esc(d.why)}</span>${d.conf?`<span class="muted xs">Confidence ${d.conf}%</span>`:''}<span class="muted xs">Agent owner: ${a.owner}</span></div>` : ''}
    <div class="dec-foot"><button class="ap-button ghost blue" data-why="${d.id}"><span>${S.openWhy[d.id]?'Hide':'Why?'}</span></button>${foot}</div>
  </article>`;
}

function resolve(id, logText, undoable){
  const d = S.decisions.find(x=>x.id===id), idx = S.decisions.indexOf(d), a = agentById(d.agent);
  const el = $('card-'+id); if(el) el.classList.add('leaving');
  setTimeout(()=>{
    S.decisions.splice(idx,1); delete S.editing[id]; delete S.rejecting[id];
    addLog({ who:R().name, ag:false, act:logText, profile:d.profile, res: undoable?'Sent, undo for 30 s':'Done', why:`${a.name} proposal (${d.kind}). ${d.why}`, undo:!!undoable });
    if(d.id==='d9'){ S.levels['inbox-lune:0']='auto'; }
    render();
    snack(logText, undoable ? () => { S.decisions.splice(idx,0,d); S.log.shift(); render(); snack('Cancelled. Nothing was sent.'); } : null);
  }, 220);
}

function viewPlaybook(){
  const r = R(), keys = ['org', ...r.clients];
  if(!keys.includes(S.pb)) S.pb = keys[1] || 'org';
  const pb = PLAYBOOK[S.pb];
  return `
  <div class="sec-head"><div><h2 class="ap-h3">Playbook</h2><p class="muted">Shared memory for all agents. Client rules override organization rules.</p></div></div>
  <div class="ap-tabs"><div class="ap-tabs-nav">${keys.map(k=>`<button class="ap-tabs-tab${k===S.pb?' active':''}" data-pb="${k}">${PLAYBOOK[k].name}${PLAYBOOK[k].pending?.length?`<span class="ap-counter normal orange">${PLAYBOOK[k].pending.length}</span>`:''}</button>`).join('')}</div></div>
  ${pb.pending?.length ? `<section class="ap-card pad"><div><h2 class="ap-h4">Suggested rules</h2><p class="muted">Learned from your edits and rejections. Never added without a person.</p></div>
    <div>${pb.pending.map((p,i)=>`<div class="rule"><i class="ap-icon-sparkles"></i><div class="t"><div>${esc(p.r)}</div><div class="muted xs">${esc(p.from)}</div></div>
      ${r.validateRules ? `<button class="ap-button stroked grey" data-rule-no="${i}"><span>Dismiss</span></button><button class="ap-button primary blue" data-rule-yes="${i}"><span>Add rule</span></button>`
        : `<span class="muted xs">Waiting for an admin</span>`}</div>`).join('')}</div></section>` : ''}
  <section class="ap-card pad"><h2 class="ap-h4">Tone of voice</h2><div>${pb.tone.map(t=>`<div class="rule"><i class="ap-icon-check"></i><div class="t">${esc(t)}</div></div>`).join('')}</div></section>
  <section class="ap-card pad"><h2 class="ap-h4">Never do</h2><div>${pb.dont.map(t=>`<div class="rule"><i class="ap-icon-close"></i><div class="t">${esc(t)}</div></div>`).join('')}</div></section>
  ${pb.saved ? `<section class="ap-card pad"><h2 class="ap-h4">Saved replies agents can use</h2><div class="tags">${pb.saved.map(t=>`<span class="ap-tag grey"><span>${esc(t)}</span></span>`).join('')}</div></section>` : ''}
  ${!r.validateRules ? `<div class="row muted xs"><i class="ap-icon-lock-on"></i><span>You can suggest rules from any decision. Admins add them.</span></div>` : ''}`;
}

/* --- activity --- */
function viewActivity(){
  const scope = S.log.filter(l => sees(PROFILES[l.profile].client));
  const f = S.actFilter || 'all';
  const rows = scope.filter(l => f==='all' || (f==='agents' ? l.ag : !l.ag));
  return `
  <div class="sec-head"><div><h2 class="ap-h3">Activity</h2><p class="muted">Everything agents and people did, with the reason.</p></div><span class="spacer"></span>
    <button class="ap-button stroked grey" id="export"><i class="ap-icon-download"></i><span>Export</span></button></div>
  <div class="ap-tabs"><div class="ap-tabs-nav">${[['all','All'],['agents','Agents'],['people','People']].map(([k,l])=>`<button class="ap-tabs-tab${k===f?' active':''}" data-act="${k}">${l}</button>`).join('')}</div></div>
  <div class="ap-card"><table class="ap-table"><thead><tr><th>Time</th><th>Who</th><th>What</th><th>Profile</th><th>Result</th><th></th></tr></thead><tbody>
  ${rows.map((l,i)=>{ const gi = S.log.indexOf(l); return `<tr><td class="muted">${l.t}</td>
    <td><div class="row">${l.ag?`<div class="ag-ico"><i class="ap-icon-sparkles"></i></div>`:person(l.who,32)}<span>${esc(l.who)}</span></div></td>
    <td>${esc(l.act)}${S.openLog===gi?`<div class="muted xs" style="margin-top:4px">${esc(l.why)}</div>`:''}</td>
    <td>${profAv(l.profile,32)}</td>
    <td><span class="ap-status ${l.res.startsWith('Rejected')||l.res.startsWith('Cancelled')?'grey':l.res.startsWith('Escalated')||l.res.startsWith('Waiting')?'orange':'green'}">${l.res}</span></td>
    <td><div class="row"><button class="ap-button ghost blue" data-log-why="${gi}"><span>${S.openLog===gi?'Hide':'Why?'}</span></button>
      ${l.undo && R().modules.length ? `<button class="ap-button ghost grey" data-log-undo="${gi}"><span>Undo</span></button>` : ''}</div></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* --- guardrails --- */
function viewGuardrails(){
  const r = R();
  const clients = r.clients;
  return `
  <div class="sec-head"><div><h2 class="ap-h3">Guardrails</h2><p class="muted">Limits that apply to every agent, whatever their settings.</p></div></div>
  <section class="ap-card pad"><div><h2 class="ap-h4">Emergency pause</h2><p class="muted">Stops all replies and scheduled posts by agents. Anyone with access to a client can pause it, only admins can resume.</p></div>
    <div>
      ${r.guardrails ? `<div class="switch-row"><div class="spacer"><div class="b">All clients</div><div class="muted xs">Every agent in the organization</div></div><label class="ap-toggle-container"><input type="checkbox" data-pause-scope="all" ${S.paused.all?'checked':''}><i></i></label></div>` : ''}
      ${clients.map(c=>{ const on = S.paused[c]||S.paused.all; const lock = on && !r.configure;
        return `<div class="switch-row"><div class="spacer"><div class="b">${CLIENTS[c].name}</div><div class="muted xs">${AGENTS.filter(a=>a.client===c).length} agents${lock?' · Paused. Ask an admin to resume.':''}</div></div>
        <label class="ap-toggle-container"><input type="checkbox" data-pause-scope="${c}" ${on?'checked':''} ${(!r.pause || lock || S.paused.all)?'disabled':''}><i></i></label></div>`; }).join('')}
    </div></section>
  ${r.guardrails ? `
  <section class="ap-card pad"><h2 class="ap-h4">Red list</h2><p class="muted">These always go to a person, whatever the autonomy level.</p>
    <div class="tags">${['Press and journalists','Verified accounts','Legal threats','Health or safety issues','Words: lawyer, refund fraud, lawsuit'].map(t=>`<span class="ap-tag red"><span>${t}</span></span>`).join('')}<span class="ap-tag grey"><span>+ Add</span></span></div></section>
  <section class="ap-card pad"><h2 class="ap-h4">Limits</h2>
    <div class="kv"><span class="muted">Quiet hours</span><span>No messages sent alone from 10 pm to 7 am</span>
    <span class="muted">Max actions alone</span><span>500 a day for the organization</span>
    <span class="muted">If budget runs out</span><span>Agents switch back to Suggest</span></div></section>
  <section class="ap-card pad"><div class="sec-head"><h2 class="ap-h4">AI credits this month</h2><span class="spacer"></span><span class="b">7,420 of 10,000 used</span></div>
    <div class="bar"><span style="width:74%"></span></div><p class="muted xs">Resets on December 1. You'll get an alert at 90%.</p></section>`
  : `<div class="row muted xs"><i class="ap-icon-lock-on"></i><span>Red list, limits and AI budget are managed by organization admins.</span></div>`}`;
}

/* ---------------- events ---------------- */
$('view').addEventListener('click', e => {
  const t = e.target.closest('button, [data-go], [data-agent], .ap-tag[data-reject-reason]'); if(!t) return;
  const ds = t.dataset;
  if(ds.go){ S.view = ds.go; S.agent=null; render(); $('scroll').scrollTop=0; return; }
  if(ds.tab){ S.tab = ds.tab; render(); return; }
  if(ds.why){ S.openWhy[ds.why] = !S.openWhy[ds.why]; render(); return; }
  if(ds.reject){ S.rejecting[ds.reject] = true; render(); return; }
  if(ds.cancelReject){ delete S.rejecting[ds.cancelReject]; render(); return; }
  if(ds.rejectReason){ resolveReject(ds.rejectReason, ds.r); return; }
  if(ds.edit){ S.editing[ds.edit] = true; render(); const ta=$('ed-'+ds.edit); ta && ta.focus(); return; }
  if(ds.cancelEdit){ delete S.editing[ds.cancelEdit]; render(); return; }
  if(ds.approve){ const d=S.decisions.find(x=>x.id===ds.approve); resolve(d.id, (ds.edited?'Edited and ':'')+(ds.edited?d.approveLog.charAt(0).toLowerCase()+d.approveLog.slice(1):d.approveLog), d.undo); return; }
  if(ds.secondary){ const d=S.decisions.find(x=>x.id===ds.secondary); resolve(d.id, d.secondary+' · '+d.title, false); return; }
  if(ds.fallback){ const d=S.decisions.find(x=>x.id===ds.fallback); snack('Sent to Karim Benali for approval'); addLog({who:R().name, ag:false, act:d.fallback+': '+d.title, profile:d.profile, res:'Waiting for an admin', why:d.why}); return; }
  if(ds.agent){ S.agent = ds.agent; S.sim=null; render(); $('scroll').scrollTop=0; return; }
  if(ds.back!==undefined){ S.agent=null; render(); return; }
  if(ds.sim){ S.sim='loading'; t.classList.add('loading'); setTimeout(()=>{ S.sim=ds.sim; render(); }, 1200); return; }
  if(ds.pause){ agentById(ds.pause).status='paused'; addLog({who:R().name, ag:false, act:'Paused '+agentLabel(agentById(ds.pause)), profile:agentById(ds.pause).profiles[0], res:'Done', why:'Manual pause.'}); render(); snack('Agent paused. Nothing will be sent until an admin resumes it.'); return; }
  if(ds.resume){ agentById(ds.resume).status='active'; render(); snack('Agent resumed'); return; }
  if(ds.pb){ S.pb = ds.pb; render(); return; }
  if(ds.ruleYes!==undefined || ds.ruleNo!==undefined){ const i = +(ds.ruleYes ?? ds.ruleNo); const p = PLAYBOOK[S.pb].pending.splice(i,1)[0];
    if(ds.ruleYes!==undefined){ PLAYBOOK[S.pb].tone.push(p.r); snack('Rule added. All agents on this client will use it.'); } else snack('Rule dismissed'); render(); return; }
  if(ds.act){ S.actFilter = ds.act; render(); return; }
  if(ds.logWhy!==undefined){ S.openLog = S.openLog===+ds.logWhy ? null : +ds.logWhy; render(); return; }
  if(ds.logUndo!==undefined){ const l=S.log[+ds.logUndo]; l.res='Cancelled'; l.undo=false; render(); snack('Action cancelled. The reply was deleted.'); return; }
  if(t.id==='export'){ snack('Export ready: activity_november.csv'); return; }
  if(t.id==='newAgent'){ snack('Agent creation is not part of this prototype'); return; }
});
$('view').addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.level){ S.levels[t.dataset.level] = t.value; const l = LEVELS.find(x=>x.k===t.value);
    snack('Autonomy set to '+l.label); addLog({who:R().name, ag:false, act:'Changed autonomy to '+l.label, profile:agentById(t.dataset.level.split(':')[0]).profiles[0], res:'Done', why:'Agent settings.'}); }
  if(t.dataset.pauseScope){ const c=t.dataset.pauseScope; S.paused[c]=t.checked; render();
    snack(t.checked ? (c==='all'?'All agents paused':CLIENTS[c].name+' agents paused') : 'Agents resumed'); }
});
function resolveReject(id, reason){
  const d = S.decisions.find(x=>x.id===id);
  resolve(id, 'Rejected: "'+reason+'" · '+d.title, false);
  setTimeout(()=>{ S.log[0].res='Rejected'; render(); }, 260);
}

render();
</script>
</body>
</html>
