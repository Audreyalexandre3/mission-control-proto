<!doctype html>
<!-- mode: html-prototype · design-guidelines · DS: @agorapulse/ui-theme@22.0.7 + ui-symbol@22.0.0 via jsDelivr -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control · Agorapulse prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@22.0.7/assets/desktop_variables.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@22.0.7/assets/style/css-ui/font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-symbol@22.0.0/icons/ap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@22.0.7/assets/style/css-ui/index.css">
<style>
  /* Layout only. Visual components are DS CSS-UI classes (.ap-*). Borders we author use grey-20 (house rule). */
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--ref-color-grey-bg); color:var(--ref-color-grey-100); font-family:var(--ref-font-family); font-size:var(--ref-font-size-sm); -webkit-font-smoothing:antialiased; }
  h1,h2,h3,p { margin:0; }
  .muted { color:var(--ref-color-grey-80); }
  .xs { font-size:var(--ref-font-size-xs); line-height:var(--ref-font-line-height-xs); }
  .b { font-weight:var(--ref-font-weight-bold); }
  .row { display:flex; align-items:center; gap:var(--ref-spacing-xxs); }
  .spacer { flex:1; }
  [hidden] { display:none !important; }

  .app { display:grid; grid-template-columns:220px 1fr; height:100vh; }

  /* nav */
  .nav { background:var(--ref-color-white); border-right:1px solid var(--ref-color-grey-20); display:flex; flex-direction:column; padding:var(--ref-spacing-xs) var(--ref-spacing-xxs); overflow:auto; }
  .logo { font-weight:var(--ref-font-weight-bold); font-size:21px; letter-spacing:-.03em; color:var(--ref-color-orange-100); padding:2px 8px 12px; }
  .nav-sec { padding:14px 10px 6px; font-size:var(--ref-font-size-xs); color:var(--ref-color-grey-80); font-weight:var(--ref-font-weight-bold); }
  .navitem { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--ref-border-radius-md); cursor:pointer; color:var(--ref-color-grey-100); background:none; border:0; font:inherit; text-align:left; width:100%; }
  .navitem:hover { background:var(--ref-color-grey-05); }
  .navitem.active { background:var(--ref-color-electric-blue-10); color:var(--ref-color-electric-blue-100); font-weight:var(--ref-font-weight-bold); }
  .navitem .ap-counter { margin-left:auto; }
  .navitem.dim { color:var(--ref-color-grey-80); }
  .nav .grow { flex:1; }

  /* main */
  .main { display:flex; flex-direction:column; min-width:0; height:100vh; }
  .head { display:flex; align-items:center; gap:var(--ref-spacing-xs); height:64px; padding:0 var(--ref-spacing-md); background:var(--ref-color-white); border-bottom:1px solid var(--ref-color-grey-20); flex-shrink:0; position:relative; }
  .head h1 { white-space:nowrap; }
  .scroll { position:relative; flex:1; overflow:auto; padding:var(--ref-spacing-lg) var(--ref-spacing-md) 120px; }
  .wrap { max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:var(--ref-spacing-md); }

  /* role switcher */
  .who-btn .ap-avatar { margin-right:2px; }
  .menu { position:absolute; top:56px; right:var(--ref-spacing-md); width:380px; z-index:50; padding:var(--ref-spacing-xxs); }
  .menu .ap-action-dropdown-item { align-items:flex-start; gap:var(--ref-spacing-xs); cursor:pointer; }
  .menu .ap-action-dropdown-item.sel { background:var(--ref-color-electric-blue-10); }
  .menu-foot { display:flex; align-items:center; justify-content:space-between; padding:10px 12px 6px; }

  /* cards */
  .ap-card.pad { padding:var(--ref-spacing-md); display:flex; flex-direction:column; gap:var(--ref-spacing-sm); }
  .sec-head { display:flex; align-items:center; gap:var(--ref-spacing-xs); }
  .sec-head p { margin-top:2px; }

  /* home */
  .hello h1 { margin-bottom:4px; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--ref-spacing-sm); }
  .tile { background:var(--ref-color-white); border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:var(--ref-spacing-sm); }
  .tile .v { font-size:24px; font-weight:var(--ref-font-weight-bold); line-height:32px; }
  .two { display:grid; grid-template-columns:1.4fr 1fr; gap:var(--ref-spacing-md); align-items:start; }
  .mini-dec { display:flex; align-items:center; gap:var(--ref-spacing-xs); padding:10px 0; border-top:1px solid var(--ref-color-grey-20); cursor:pointer; }
  .mini-dec:first-of-type { border-top:0; }
  .mini-dec .t { flex:1; min-width:0; }
  .mini-dec .t div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .health { display:flex; align-items:center; gap:var(--ref-spacing-xs); padding:8px 0; border-top:1px solid var(--ref-color-grey-20); }
  .health:first-of-type { border-top:0; }
  .access li { display:flex; gap:8px; align-items:flex-start; padding:4px 0; }
  .access ul { list-style:none; margin:0; padding:0; }
  .access .yes i { color:var(--ref-color-green-100); }
  .access .no i { color:var(--ref-color-grey-80); }

  /* decisions */
  .filters { display:flex; align-items:center; gap:var(--ref-spacing-sm); }
  .dec { padding:var(--ref-spacing-md); display:flex; flex-direction:column; gap:var(--ref-spacing-xs); }
  .dec.leaving { opacity:0; transform:translateY(-6px); transition:all .25s; }
  .dec-meta { display:flex; align-items:center; gap:var(--ref-spacing-xxs); flex-wrap:wrap; }
  .dec-meta .sep { color:var(--ref-color-grey-80); }
  .dec h3 { font-size:var(--ref-font-size-md); line-height:var(--ref-font-line-height-md); }
  .quote { background:var(--ref-color-grey-05); border-radius:var(--ref-border-radius-md); padding:10px 12px; }
  .draft { border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:10px 12px; }
  .draft .lbl { margin-bottom:4px; }
  .draft ul { margin:4px 0 0; padding-left:18px; }
  .why { background:var(--ref-color-grey-05); border-radius:var(--ref-border-radius-md); padding:10px 12px; display:flex; flex-direction:column; gap:4px; }
  .dec-foot { display:flex; align-items:center; gap:var(--ref-spacing-sm); margin-top:4px; }
  .dec-foot .acts { display:flex; gap:var(--ref-spacing-sm); margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
  .reasons { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .reasons .ap-tag { cursor:pointer; }
  .blocked { display:flex; align-items:center; gap:6px; }
  .uc { display:none; }
  body.show-uc .uc { display:inline-flex; }

  /* agents */
  .ap-table { width:100%; }
  .ap-table tr.click { cursor:pointer; }
  .ap-table th { text-align:left; font-weight:var(--ref-font-weight-bold); color:var(--ref-color-grey-80); font-size:var(--ref-font-size-xs); padding:8px 12px; border-bottom:1px solid var(--ref-color-grey-20); }
  .ap-table td { padding:10px 12px; vertical-align:middle; }
  .ag-name { display:flex; align-items:center; gap:10px; }
  .ag-ico { width:32px; height:32px; border-radius:var(--ref-border-radius-md); background:var(--ref-color-grey-05); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .kv { display:grid; grid-template-columns:160px 1fr; gap:10px 16px; align-items:start; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tags .ap-tag, .tags .ap-tag > span { max-width:none; overflow:visible; text-overflow:clip; }
  .auto-table td.c, .auto-table th.c { text-align:center; }
  .auto-table .ap-radio-container { justify-content:center; display:inline-flex; }
  .lvl-legend { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .lvl-legend div { border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:8px 10px; }

  /* playbook */
  .rule { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--ref-color-grey-20); }
  .rule:first-child { border-top:0; }
  .rule .t { flex:1; }

  /* guardrails */
  .switch-row { display:flex; align-items:center; gap:var(--ref-spacing-xs); padding:10px 0; border-top:1px solid var(--ref-color-grey-20); }
  .switch-row:first-child { border-top:0; }
  .bar { height:8px; background:var(--ref-color-grey-10); border-radius:8px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--ref-color-orange-100); }

  /* empty state */
  .empty { text-align:center; padding:var(--ref-spacing-xl) var(--ref-spacing-md); display:flex; flex-direction:column; align-items:center; gap:var(--ref-spacing-xs); }
  .empty .ico { width:56px; height:56px; border-radius:50%; background:var(--ref-color-grey-05); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ref-color-grey-80); }
  .empty p { max-width:460px; }

  .snack { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:80; }
  .proto-tag { margin-left:auto; }
  /* agentic interactions */
  .cmd-btn { margin-left:auto; }
  .head .proto-tag { margin-left:0; }
  .kbd { display:inline-flex; align-items:center; justify-content:center; min-width:20px; border:1px solid var(--ref-color-grey-20); border-radius:4px; padding:0 5px; font-size:var(--ref-font-size-xs); line-height:18px; color:var(--ref-color-grey-80); background:var(--ref-color-white); }
  .overlay { position:fixed; inset:0; background:color-mix(in srgb, var(--ref-color-grey-150) 45%, transparent); z-index:90; display:flex; justify-content:center; align-items:flex-start; padding:12vh 16px 0; }
  .cmd { width:640px; max-width:100%; padding:var(--ref-spacing-xs); display:flex; flex-direction:column; gap:var(--ref-spacing-xs); }
  .cmd-note { padding:4px 8px 0; }
  .cmd-item { display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:var(--ref-border-radius-md); cursor:pointer; }
  .cmd-item:hover, .cmd-item.sel { background:var(--ref-color-grey-05); }
  .cmd-item i { color:var(--ref-color-grey-80); }
  .overlay.right { justify-content:flex-end; align-items:stretch; padding:0; }
  .drawer { width:480px; max-width:100%; height:100%; border-radius:0; padding:var(--ref-spacing-md); display:flex; flex-direction:column; gap:var(--ref-spacing-sm); overflow:auto; }
  .ext-box { border:1px solid var(--ref-color-grey-20); border-radius:var(--ref-border-radius-md); padding:12px; display:flex; flex-direction:column; gap:8px; }
  .ext-box.phone { max-width:340px; border-radius:16px; background:var(--ref-color-grey-05); }
  .steer { display:flex; flex-direction:column; gap:8px; }
  .steer .ap-tag { cursor:pointer; }
  .q-opts { display:flex; gap:var(--ref-spacing-xs); flex-wrap:wrap; }
  .dec.focused { border-color:var(--ref-color-electric-blue-100); }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--ref-color-green-100); display:inline-block; flex-shrink:0; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .live-line { display:flex; align-items:center; gap:6px; }
  .step, .obj-row { display:flex; align-items:center; gap:var(--ref-spacing-xs); padding:12px 0; border-top:1px solid var(--ref-color-grey-20); }
  .step:first-child, .obj-row:first-child { border-top:0; }
  .step.off { opacity:.5; }
  .step-n { width:24px; height:24px; border-radius:50%; background:var(--ref-color-grey-05); display:flex; align-items:center; justify-content:center; font-size:var(--ref-font-size-xs); font-weight:var(--ref-font-weight-bold); flex-shrink:0; }
  .obj-row.click { cursor:pointer; }
  @media (max-width:1100px){ .tiles{grid-template-columns:repeat(2,1fr);} .two{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="logo">agorapulse</div>
    <div class="nav-sec">Mission Control</div>
    <button class="navitem" data-view="home"><i class="ap-icon-sparkles"></i>Home</button>
    <button class="navitem" data-view="decisions"><i class="ap-icon-rounded-check"></i>Decisions<span class="ap-counter normal blue" id="navCount"></span></button>
    <button class="navitem" data-view="objectives"><i class="ap-icon-target"></i>Objectives</button>
    <button class="navitem" data-view="agents"><i class="ap-icon-multiple-users"></i>Agents</button>
    <button class="navitem" data-view="playbook"><i class="ap-icon-bookmark"></i>Playbook</button>
    <button class="navitem" data-view="activity"><i class="ap-icon-history"></i>Activity</button>
    <button class="navitem" data-view="guardrails"><i class="ap-icon-lock-on"></i>Guardrails</button>
    <div class="nav-sec">Modules</div>
    <button class="navitem dim" data-out><i class="ap-icon-calendar"></i>Publishing</button>
    <button class="navitem dim" data-out><i class="ap-icon-feature-inbox"></i>Inbox</button>
    <button class="navitem dim" data-out><i class="ap-icon-feature-listening"></i>Listening</button>
    <button class="navitem dim" data-out><i class="ap-icon-data-report"></i>Reports</button>
    <div class="grow"></div>
  </nav>

  <div class="main">
    <header class="head">
      <h1 class="ap-h3" id="title">Home</h1>
      <button class="ap-button stroked grey cmd-btn" id="cmdBtn"><i class="ap-icon-sparkles"></i><span>Ask or command</span><span class="kbd">⌘K</span></button>
      <span class="ap-status blue no-dot proto-tag">Prototype</span>
      <button class="ap-button stroked grey who-btn" id="whoBtn" aria-expanded="false"><span id="whoAvatar"></span><span id="whoName"></span><i class="ap-icon-chevron-down"></i></button>
      <div class="ap-action-dropdown menu" id="whoMenu" hidden></div>
    </header>
    <div class="scroll" id="scroll"><div class="wrap" id="view"></div></div>
  </div>
</div>
<div class="ap-snackbar snack" id="snack" hidden><div class="ap-snackbar-left"><span id="snackText"></span></div><div class="ap-snackbar-right" id="snackRight"></div></div>
<div class="overlay" id="cmdOverlay" hidden><div class="ap-card cmd" role="dialog" aria-label="Ask or command">
  <div class="ap-input-group"><i class="ap-icon-sparkles"></i><input id="cmdInput" placeholder="Ask anything or tell agents what to do" autocomplete="off"></div>
  <div id="cmdBody"></div>
  <div class="row muted xs cmd-note"><span>Mission Control acts across the app, within your rights.</span><span class="spacer"></span><span class="kbd">Enter</span><span>run</span><span class="kbd">Esc</span><span>close</span></div>
</div></div>
<div class="overlay right" id="slackOverlay" hidden><aside class="ap-card drawer" id="slackBody"></aside></div>

<script>
/* ---------------- data ---------------- */
const CLIENTS = { lune:{name:'Maison Lune'}, velo:{name:'Vélo Nord'}, brio:{name:'Café Brio'} };
const PROFILES = {
  'lune-ig':{client:'lune', net:'instagram', handle:'@maisonlune'},
  'lune-fb':{client:'lune', net:'facebook', handle:'Maison Lune'},
  'lune-li':{client:'lune', net:'linkedin', handle:'Maison Lune'},
  'velo-ig':{client:'velo', net:'instagram', handle:'@velonord'},
  'velo-fb':{client:'velo', net:'facebook', handle:'Vélo Nord'},
  'brio-ig':{client:'brio', net:'instagram', handle:'@cafebrio'},
  'brio-li':{client:'brio', net:'linkedin', handle:'Café Brio'},
};
const MODULES = { inbox:'Inbox', publishing:'Publishing', listening:'Listening', reports:'Reports' };
const MOD_ICON = { inbox:'feature-inbox', publishing:'calendar', listening:'feature-listening', reports:'data-report' };

const ROLES = {
  sophie:{ name:'Sophie Martin', role:'Organization admin', desc:'Agency lead. All clients, all modules.', clients:['lune','velo','brio'], modules:['inbox','publishing','listening','reports'], configure:true, grantAuto:true, validateRules:true, guardrails:true, pause:true },
  karim:{ name:'Karim Benali', role:'Workspace admin · Maison Lune', desc:'Social media manager. One client, all modules.', clients:['lune'], modules:['inbox','publishing','listening','reports'], configure:true, grantAuto:true, validateRules:true, guardrails:false, pause:true },
  lea:{ name:'Léa Petit', role:'Member · Inbox', desc:'Community manager. Inbox rights on 2 clients.', clients:['lune','velo'], modules:['inbox'], configure:false, grantAuto:false, validateRules:false, guardrails:false, pause:true },
  hugo:{ name:'Hugo Laurent', role:'Read only · Maison Lune', desc:'Can look, cannot act.', clients:['lune'], modules:[], configure:false, grantAuto:false, validateRules:false, guardrails:false, pause:false },
  thomas:{ name:'Thomas Girard', role:'External approver · Café Brio', desc:'The agency client. Approves posts only.', external:true, clients:[], modules:[] },
};

const LEVELS = [
  {k:'suggest', label:'Suggest', hint:'Shows an idea, you do the work'},
  {k:'draft', label:'Draft', hint:'Prepares it, you approve'},
  {k:'undo', label:'Act with undo', hint:'Does it after 30 s unless you cancel'},
  {k:'auto', label:'Act alone', hint:'Does it and logs it'},
];

const AGENTS = [
  { id:'inbox-lune', name:'Inbox agent', module:'inbox', client:'lune', owner:'Karim Benali', status:'active', week:412, rate:94,
    mission:'Answer routine messages on Maison Lune profiles and route the rest to the right person.',
    profiles:['lune-ig','lune-fb','lune-li'],
    triggers:['New comment or private message','Every day, 7 am to 10 pm','Not on posts labeled "Campaign legal"'],
    escalate:'Customer care team, then Karim Benali',
    limits:'Up to 300 replies a day · Never more than 1 reply per person per hour',
    actions:[ {n:'Thank-you replies', l:'auto'}, {n:'Shipping and FAQ answers', l:'draft'}, {n:'Complaints', l:'suggest', note:'Always assigned to a person'}, {n:'Hide spam and insults', l:'undo'}, {n:'Press and verified accounts', l:'suggest', locked:'Red list. Always handled by a person.'} ] },
  { id:'inbox-velo', name:'Inbox agent', module:'inbox', client:'velo', owner:'Sophie Martin', status:'active', week:268, rate:89,
    mission:'Answer routine messages on Vélo Nord profiles. Complaints go to support.',
    profiles:['velo-ig','velo-fb'], triggers:['New comment or private message','Every day, 8 am to 8 pm'],
    escalate:'Vélo Nord support team', limits:'Up to 200 replies a day',
    actions:[ {n:'Thank-you replies', l:'auto'}, {n:'Shipping and FAQ answers', l:'draft'}, {n:'Complaints', l:'suggest', note:'Always assigned to a person'}, {n:'Hide spam and insults', l:'undo'} ] },
  { id:'pub-lune', name:'Publishing agent', module:'publishing', client:'lune', owner:'Karim Benali', status:'active', week:9, rate:78,
    mission:'Keep the Maison Lune calendar full with posts that match the playbook.',
    profiles:['lune-ig','lune-fb','lune-li'], triggers:['Calendar gap of more than 2 days','A post performs 2× above average','Sensitive news detected'],
    escalate:'Karim Benali', limits:'Up to 10 drafts a week · Never publishes without review',
    actions:[ {n:'Fill calendar gaps', l:'draft'}, {n:'Recycle top posts', l:'suggest'}, {n:'Pause risky scheduled posts', l:'undo'}, {n:'Publish without review', l:'suggest', locked:'Not available for this client.'} ] },
  { id:'pub-brio', name:'Publishing agent', module:'publishing', client:'brio', owner:'Sophie Martin', status:'active', week:12, rate:83,
    mission:'Prepare the monthly calendar for Café Brio, then send it to the client for approval.',
    profiles:['brio-ig','brio-li'], triggers:['Every month, on the 20th'], escalate:'Sophie Martin, then the client approver',
    limits:'Up to 15 drafts a month', actions:[ {n:'Prepare monthly calendar', l:'draft'}, {n:'Send to client approval', l:'draft'} ] },
  { id:'listen', name:'Listening agent', module:'listening', client:'velo', owner:'Sophie Martin', status:'active', week:31, rate:72,
    mission:'Spot topics and mentions that matter to Vélo Nord and turn them into actions.',
    profiles:['velo-ig','velo-fb'], triggers:['Topic volume up more than 150%','Brand mention without a tag'],
    escalate:'Sophie Martin', limits:'Up to 5 alerts a day',
    actions:[ {n:'Trend alerts', l:'auto'}, {n:'Untagged mentions to Inbox', l:'draft'}, {n:'Post ideas from trends', l:'suggest'} ] },
  { id:'rep-brio', name:'Reporting agent', module:'reports', client:'brio', owner:'Sophie Martin', status:'paused', week:0, rate:91,
    mission:'Write the Café Brio monthly report and suggest changes based on results.',
    profiles:['brio-ig','brio-li'], triggers:['Last day of the month'], escalate:'Sophie Martin', limits:'1 report a month',
    actions:[ {n:'Monthly report', l:'draft'}, {n:'Calendar changes from insights', l:'suggest'} ] },
];
const agentById = id => AGENTS.find(a=>a.id===id);

const INIT_DECISIONS = [
  { id:'d1', uc:'I4', agent:'inbox-lune', profile:'lune-fb', urgency:'high', kind:'Possible crisis', title:'A 1-star review is spreading fast',
    context:'Shared 40 times in 2 hours · 18 negative comments', quote:'"Ordered a lamp for my mother\'s birthday, arrived broken, no answer for 10 days. Avoid."',
    draft:'We\'re really sorry about this. Our team is on it and will message you privately today to fix it.',
    extra:'3 scheduled posts on this profile are paused for 2 hours.',
    why:'Activity on this post is 6× above normal. Crisis rule: pause scheduled posts and suggest a holding reply.', conf:81,
    approve:'Send reply', approveLog:'Holding reply sent, posts kept paused', undo:true },
  { id:'d2', uc:'I3', agent:'inbox-velo', profile:'velo-ig', urgency:'high', kind:'Complaint', title:'@julien.r is unhappy about a late order',
    context:'Private message · 3rd message this month', quote:'"Third time my order is late. Nobody answers my emails."',
    draft:'Hi Julien, sorry for the wait. I\'m passing your order to our support team right now, they\'ll get back to you within the hour.',
    why:'Negative sentiment and 2 earlier messages. Rule: complaints always go to a person. Suggested owner: support team.', conf:74,
    approve:'Assign to support', approveLog:'Assigned to Vélo Nord support with suggested reply', secondary:'Reply myself' },
  { id:'d3', uc:'I2', agent:'inbox-lune', profile:'lune-ig', urgency:'med', kind:'FAQ', title:'@marie_dsgn asks about shipping to Belgium',
    context:'Comment on "New spring collection" · +6 similar questions', quote:'"Do you ship to Belgium?"',
    draft:'Hi Marie! Yes, we ship to Belgium in 3 to 5 days. Shipping is free from 60 €.',
    why:'Matches saved reply "Shipping abroad". Tone from the Maison Lune playbook.', conf:92,
    approve:'Send to all 7', approveLog:'7 replies sent', undo:true, editable:true },
  { id:'d4', uc:'I6', agent:'inbox-lune', profile:'lune-li', urgency:'high', kind:'Press', title:'A journalist wants to interview the founder',
    context:'Claire Dubois · Le Journal du Design · verified account', quote:'"Could we interview your founder next week for our spring issue?"',
    why:'Verified press account. Red list: press messages are never answered by an agent.', conf:null,

function snack(text, undoFn){
  $('snackText').textContent = text;
  $('snackRight').innerHTML = undoFn ? `<button id="snackUndo">Undo</button>` : '';
  $('snack').hidden = false;
  if(undoFn) $('snackUndo').onclick = () => { undoFn(); $('snack').hidden = true; };
  clearTimeout(snack.t); snack.t = setTimeout(()=>$('snack').hidden=true, undoFn?6000:2600);
}
function now(){ const d=new Date(); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

  document.querySelectorAll('.navitem[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===S.view && !ext));

/* --- decisions --- */
function viewDecisions(){
  const vis = visibleDecisions();
  const mods = ['all', ...Object.keys(MODULES).filter(m=>vis.some(d=>modOf(d)===m))];
  if(!mods.includes(S.tab)) S.tab='all';
  const list = vis.filter(d => S.tab==='all' || modOf(d)===S.tab)
    .sort((a,b)=>'hml'.indexOf(a.urgency[0])-'hml'.indexOf(b.urgency[0]));
  S.curList = list.map(d=>d.id); if(!(S.focus < list.length)) S.focus = 0;
  const readOnly = R().modules.length===0;
  return `
  ${readOnly ? `<div class="ap-infobox info"><i class="ap-icon-info"></i><div class="ap-infobox-content"><div class="ap-infobox-texts"><span class="ap-infobox-message">You have read-only access. You can follow decisions, not approve them.</span></div></div></div>` : ''}
  <div class="filters"><div class="ap-tabs"><div class="ap-tabs-nav" role="tablist">${mods.map(m=>{ const n = vis.filter(d=>m==='all'||modOf(d)===m).length;
      return `<button class="ap-tabs-tab${m===S.tab?' active':''}" data-tab="${m}">${m==='all'?'All':MODULES[m]}<span class="ap-counter normal ${m===S.tab?'blue':'grey'}">${n}</span></button>`; }).join('')}</div></div>
    <span class="spacer"></span>${readOnly ? '' : `<button class="ap-button stroked grey" id="slackBtn"><i class="ap-icon-external-link"></i><span>See it in Slack</span></button>`}</div>
  ${readOnly ? '' : `<div class="row muted xs"><span class="kbd">J</span><span class="kbd">K</span><span>move</span><span class="kbd">A</span><span>approve</span><span class="kbd">R</span><span>reject</span><span class="kbd">E</span><span>edit</span><span class="kbd">⌘K</span><span>ask or command</span></div>`}
  ${list.length ? list.map(decCard).join('') : `<div class="ap-card"><div class="empty"><div class="ico"><i class="ap-icon-rounded-check"></i></div><h2 class="ap-h3">All caught up</h2><p class="muted">Your agents will bring new decisions here. Everything they did alone is in Activity.</p><button class="ap-button primary blue" data-go="activity"><span>See activity</span></button></div></div>`}`;
}

function decCard(d){
  const a = agentById(d.agent), [uc,ul] = URG[d.urgency], p = PROFILES[d.profile];
  const can = canDecide(d), hasModule = R().modules.includes(modOf(d));
  let foot;
  if(S.rejecting[d.id]){
    foot = `<div class="reasons"><span class="muted">Why reject?</span>${['Wrong tone','Wrong information','Not needed','Other'].map(r=>`<span class="ap-tag grey" data-reject-reason="${d.id}" data-r="${r}"><span>${r}</span></span>`).join('')}
      <span class="spacer"></span><button class="ap-button ghost grey" data-cancel-reject="${d.id}"><span>Cancel</span></button></div>`;
  } else if(S.editing[d.id]){
    foot = `<div class="acts"><button class="ap-button stroked grey" data-cancel-edit="${d.id}"><span>Cancel</span></button><button class="ap-button primary blue" data-approve="${d.id}" data-edited="1"><span>Save and ${d.approve.toLowerCase()}</span></button></div>`;
  } else if(can && d.question){
    foot = `<div class="acts"><button class="ap-button ghost grey" data-later="${d.id}"><span>Decide later</span></button></div>`;
  } else if(can){
    foot = `<div class="acts">
      <button class="ap-button stroked grey" data-reject="${d.id}"><i class="ap-icon-thumb-down"></i><span>Reject</span></button>
      ${d.editable||d.draft&&!d.need ? `<button class="ap-button stroked grey" data-edit="${d.id}"><i class="ap-icon-pen"></i><span>Edit</span></button>` : ''}
      ${d.secondary ? `<button class="ap-button stroked grey" data-secondary="${d.id}"><span>${d.secondary}</span></button>` : ''}
      <button class="ap-button primary blue" data-approve="${d.id}"><i class="ap-icon-check"></i><span>${d.approve}</span></button></div>`;
  } else if(hasModule && d.fallback){
    foot = `<span class="blocked muted xs"><i class="ap-icon-lock-on"></i>Only an admin can ${d.need==='grantAuto'?'let an agent act alone':'change the playbook'}.</span>
      <div class="acts"><button class="ap-button stroked grey" data-fallback="${d.id}"><span>${d.fallback}</span></button></div>`;
  } else {
    foot = `<span class="blocked muted xs"><i class="ap-icon-lock-on"></i>${R().modules.length ? 'You don\'t have '+MODULES[modOf(d)]+' rights on this profile.' : 'Read-only access.'} Someone with access will decide.</span>`;
  }
  const draftBlock = S.editing[d.id]
    ? `<div class="ap-textarea-field autoresize"><label>Suggested ${d.list?'posts':'reply'}</label><textarea id="ed-${d.id}" rows="3">${esc(d.draft || (d.list||[]).join('\n'))}</textarea></div>`
    : d.draft ? `<div class="draft"><div class="lbl muted xs b">${d.kind==='Autonomy'||d.kind==='New rule'||d.kind==='Insight' ? 'Proposed change' : 'Suggested reply'}</div><div>${esc(d.draft)}</div></div>`
    : d.list ? `<div class="draft"><div class="lbl muted xs b">Proposal</div><ul>${d.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  const st = S.steer[d.id] || {};
  const steerBlock = (can && d.draft && !d.need && !S.editing[d.id] && !S.rejecting[d.id]) ? `<div class="steer">
      ${st.busy ? `<div class="live-line muted"><span class="pulse"></span>Rewriting from "${esc(st.req)}"</div>` : `
      <div class="ap-input-group"><i class="ap-icon-sparkles"></i><input id="steer-${d.id}" data-steer="${d.id}" placeholder="Ask for a change: shorter, more formal, add a discount code…" autocomplete="off"></div>
      <div class="tags">${['Shorter','More formal','Add a discount code'].map(c=>`<span class="ap-tag grey" data-steer-chip="${d.id}" data-c="${c}"><span>${c}</span></span>`).join('')}</div>`}
      ${st.note ? `<div class="row xs"><i class="ap-icon-check"></i><span>Rewritten from "${esc(st.note)}"</span><button class="ap-button ghost blue" data-remember="${d.id}"><span>Remember for ${CLIENTS[clientOf(d)].name}</span></button></div>` : ''}
    </div>` : '';
  const qBlock = d.question ? `<div class="q-opts">${d.question.opts.map((o,i)=>`<button class="ap-button stroked grey" data-answer="${d.id}" data-i="${i}" ${can?'':'disabled'}><span>${esc(o)}</span></button>`).join('')}</div>
    ${can ? `<div class="ap-input-group"><i class="ap-icon-pen"></i><input id="ans-${d.id}" data-ans="${d.id}" placeholder="Or type your own answer and press Enter" autocomplete="off"></div>

function resolve(id, logText, undoable){
  const d = S.decisions.find(x=>x.id===id), idx = S.decisions.indexOf(d), a = agentById(d.agent);
  const el = $('card-'+id); if(el) el.classList.add('leaving');
  setTimeout(()=>{
    S.decisions.splice(idx,1); delete S.editing[id]; delete S.rejecting[id];
    addLog({ who:R().name, ag:false, act:logText, profile:d.profile, res: undoable?'Sent, undo for 30 s':'Done', why:`${a.name} proposal (${d.kind}). ${d.why}`, undo:!!undoable });
    if(d.id==='d9'){ S.levels['inbox-lune:0']='auto'; }
    render();
    snack(logText, undoable ? () => { S.decisions.splice(idx,0,d); S.log.shift(); render(); snack('Cancelled. Nothing was sent.'); } : null);
  }, 220);
}

/* --- 1. correct a draft by asking --- */
const SHORT = {
  d1:'Sorry about this. We\'ll message you privately today to fix it.',
  d2:'Sorry for the wait, Julien. Support will reply within the hour.',
  d3:'Yes! 3 to 5 days, free from 60 €.',
  d8:'Switch next week\'s 2 carousels to Reels.' };
const FORMAL = {
  d1:'We sincerely apologize for this experience. Our team will contact you privately today to resolve it.',
  d2:'Hello Julien, please accept our apologies for the delay. Our support team will contact you within the hour.',
  d3:'Hello Marie, we do ship to Belgium, within 3 to 5 days. Shipping is free for orders over 60 €.' };
function rewrite(d, req){
  const r = req.toLowerCase();
  if(/short|court|bref/.test(r)) return SHORT[d.id] || d.draft.split('. ')[0].replace(/\.?$/,'.');
  if(/formal|formel|vous|polite/.test(r)) return FORMAL[d.id] || d.draft.replace(/^Hi /,'Hello ');
  if(/discount|code|promo|geste/.test(r)) return d.draft.replace(/\s*$/,'') + ' As a thank-you for your patience, here is 10% off your next order: SORRY10.';
  if(/emoji|warm|chaleur/.test(r)) return d.draft.replace(/\.$/,'') + ' 💛';
  return d.draft.replace(/\.$/,'') + '. Let us know if there is anything else we can do.';
}
function ruleFrom(req){
  const r = req.toLowerCase();
  if(/short|court|bref/.test(r)) return 'Keep replies short: 1 or 2 sentences.';
  if(/formal|formel|vous|polite/.test(r)) return 'Use a formal tone ("vous") in replies.';
  if(/discount|code|promo|geste/.test(r)) return 'Offer a 10% code when a customer had a bad experience.';
  return 'When drafting replies: ' + req + '.';
}
function steer(id, req){
  if(!req || !req.trim()) return;
  S.steer[id] = {busy:true, req}; render();
  setTimeout(()=>{ const d = S.decisions.find(x=>x.id===id); if(!d) return; d.draft = rewrite(d, req); S.steer[id] = {note:req}; render(); }, 1100);
}
function remember(id){
  const d = S.decisions.find(x=>x.id===id), note = S.steer[id]?.note; if(!d || !note) return;
  const pb = PLAYBOOK[clientOf(d)]; (pb.pending ||= []).push({ r:ruleFrom(note), from:'From your change request, by '+R().name });
  S.steer[id].note = null; render();
  snack(R().validateRules ? 'Suggested as a rule. Review it in Playbook.' : 'Suggested as a rule. An admin will review it.');
}

/* --- 2. the agent asks a question --- */
function answer(id, text){
  const d = S.decisions.find(x=>x.id===id); if(!d || !text || !text.trim()) return;
  const sim = $('sim-'+id)?.checked;
  if(sim){ (PLAYBOOK[clientOf(d)].pending ||= []).push({ r:`When ${d.question.topic}: ${text}.`, from:'From your answer to the agent, by '+R().name }); }
  resolve(id, `Answered the agent: "${text}"${sim ? ' · saved for similar cases' : ''}`, false);
}

  {who:'Reporting agent', ico:'data-report', t:'End-of-campaign report: what to repeat next year', when:'June 20', on:true},
]; }
S.obj = { phase:'list', text:OBJ_TEXT, o:{n:9, nets:'Instagram', start:'Today'}, steps:[], note:null, launched:false, now:'' };
const rr = () => { if(S.view==='objectives' && !R().external) render(); };

function startPlanning(){
  const msgs = ['Reading the Maison Lune playbook…','Looking at last year\'s event posts…','Checking the June calendar…'];
  let i = 0;
  const t = setInterval(()=>{ i++; const el = $('planMsg');
    if(i < msgs.length){ if(el) el.textContent = msgs[i]; }
    else { clearInterval(t); S.obj.phase='plan'; S.obj.steps = planSteps(S.obj.o); rr(); } }, 800);
}
function planSteer(req){
  if(!req || !req.trim()) return;
  const r = req.toLowerCase(), o = S.obj.o;
  if(/fewer|less|moins/.test(r)) o.n = 6; else if(/more|plus de/.test(r)) o.n = 12;
  if(/linkedin/.test(r)) o.nets = 'Instagram and LinkedIn';
  if(/earlier|week|semaine|avant|tôt/.test(r)) o.start = 'Today, 4 weeks before';
  const on = S.obj.steps.map(s=>s.on);
  S.obj.steps = planSteps(o).map((s,i)=>({...s, on:on[i]}));
  S.obj.note = req; render();
}
function runFrom(i){
  const O = S.obj, s = O.steps[i]; if(!s) { O.now=''; rr(); return; }
  if(s.st==='skipped') return runFrom(i+1);
  if(s.check){ s.st='waiting'; O.now=''; rr(); snack('The plan needs your review to continue'); return; }
  if(i >= 4){ s.st='scheduled'; rr(); return runFrom(i+1); }
  s.st = 'running';
  if(i===1){ let k=0; const t = setInterval(()=>{ k++; O.now = `Drafting post ${k} of ${O.o.n}`; rr();
      if(k >= O.o.n){ clearInterval(t); s.st='done'; O.now=''; rr(); runFrom(i+1); } }, 380); return; }
  O.now = i===0 ? 'Setting up 4 keywords' : 'Scheduling posts'; rr();
  setTimeout(()=>{ s.st='done'; O.now=''; rr(); runFrom(i+1); }, 1400);
}
function objAction(a){
  const O = S.obj;
  if(a==='new'){ O.phase='new'; render(); $('objText')?.focus(); }
  if(a==='cancel' || a==='back'){ O.phase='list'; render(); }
  if(a==='plan'){ O.text = ($('objText')?.value || OBJ_TEXT).trim(); O.phase='planning'; O.note=null; O.o={n:9, nets:'Instagram', start:'Today'}; render(); startPlanning(); }
  if(a==='launch'){ O.phase='run'; O.launched=true; O.steps.forEach(s=>s.st = s.on ? 'todo' : 'skipped');
    addLog({who:R().name, ag:false, act:'Launched objective: '+O.text, profile:'lune-ig', res:'Done', why:'Plan approved in Objectives.'}); render(); runFrom(0); }
  if(a==='review'){ O.steps[2].st='done'; snack(`${O.o.n} drafts approved`);
    addLog({who:R().name, ag:false, act:`Approved ${O.o.n} campaign drafts`, profile:'lune-ig', res:'Done', why:'Objective checkpoint.'}); runFrom(3); }
  if(a==='open'){ O.phase='run'; render(); }
}
function stepStatus(s){
  return { done:'<span class="ap-status green">Done</span>', running:'<span class="ap-status blue">In progress</span>', waiting:'<span class="ap-status orange">Waiting for you</span>',
    scheduled:'<span class="ap-status grey">Scheduled</span>', skipped:'<span class="ap-status grey no-dot">Skipped</span>', todo:'<span class="ap-status grey no-dot">Next</span>' }[s.st] || '';
}
function runLabel(){
  const st = S.obj.steps; const done = st.filter(s=>s.st==='done').length, total = st.filter(s=>s.st!=='skipped').length;
  if(st.some(s=>s.st==='waiting')) return ['orange','Waiting for you'];
  if(st.some(s=>s.st==='running')) return ['blue',`Running · ${done} of ${total} done`];
  return ['green','On track · rest scheduled'];
}
function viewObjectives(){
  const r = R(), O = S.obj, canRun = r.modules.includes('publishing') && sees('lune');
  const head = `<div class="sec-head"><div><h2 class="ap-h3">Objectives</h2><p class="muted">Give agents a goal. Check their plan, then follow it live.</p></div><span class="spacer"></span>
    ${O.phase==='list' && canRun ? `<button class="ap-button primary blue" data-obj="new"><i class="ap-icon-plus"></i><span>New objective</span></button>` : ''}
    ${O.phase==='run' ? `<button class="ap-button stroked grey" data-obj="back"><i class="ap-icon-arrow-left"></i><span>All objectives</span></button>` : ''}</div>`;
  if(O.phase==='new') return head + `<section class="ap-card pad">
    <div class="ap-textarea-field"><label>What do you want to achieve?</label><textarea id="objText" rows="2">${esc(O.text)}</textarea></div>
    <p class="muted xs">Agents use your playbook, past campaigns and calendar. Nothing starts before you approve the plan.</p>
    <div class="dec-foot"><div class="acts"><button class="ap-button stroked grey" data-obj="cancel"><span>Cancel</span></button><button class="ap-button primary blue" data-obj="plan"><i class="ap-icon-sparkles"></i><span>Plan it</span></button></div></div></section>`;
  if(O.phase==='planning') return head + `<section class="ap-card pad"><div class="b">${esc(O.text)}</div><div class="live-line muted"><span class="pulse"></span><span id="planMsg">Reading the Maison Lune playbook…</span></div></section>`;
  if(O.phase==='plan' || O.phase==='run'){
    const run = O.phase==='run';
    const rows = O.steps.map((s,i)=>`<div class="step${s.on ? '' : ' off'}">
      ${!run && !s.check ? `<label class="ap-checkbox-container" title="Include this step"><input type="checkbox" data-step="${i}" ${s.on?'checked':''}><i></i></label>` : `<span class="step-n">${i+1}</span>`}
      <div class="ag-ico"><i class="ap-icon-${s.ico}"></i></div>
      <div class="spacer"><div class="b">${esc(s.t)}</div><div class="muted xs">${s.who} · ${s.when}</div>
        ${run && s.st==='running' && O.now ? `<div class="xs live-line"><span class="pulse"></span>${esc(O.now)}</div>` : ''}</div>
      ${run ? stepStatus(s) : ''}
      ${run && s.st==='waiting' ? `<button class="ap-button primary blue" data-obj="review"><span>Approve ${O.o.n} drafts</span></button>` : ''}</div>`).join('');
    return head + `<section class="ap-card pad">
      <div class="sec-head"><div><div class="muted xs">Objective · Maison Lune</div><h2 class="ap-h4">${esc(O.text)}</h2></div><span class="spacer"></span>${run ? `<span class="ap-status ${runLabel()[0]}">${runLabel()[1]}</span>` : ''}</div>
      ${!run ? `<p class="muted">Here is my plan. Untick a step to skip it, or ask for a change.</p>` : ''}
      <div>${rows}</div>
      ${!run ? `<div class="steer">
          <div class="ap-input-group"><i class="ap-icon-sparkles"></i><input data-plan-steer placeholder="Ask for a change to the plan" autocomplete="off"></div>
          <div class="tags">${['Fewer posts','Add LinkedIn','Start a week earlier'].map(c=>`<span class="ap-tag grey" data-plan-chip="${c}"><span>${c}</span></span>`).join('')}</div>
          ${O.note ? `<div class="row xs"><i class="ap-icon-check"></i><span>Plan updated from "${esc(O.note)}"</span></div>` : ''}</div>
        <div class="dec-foot"><div class="acts"><button class="ap-button stroked grey" data-obj="cancel"><span>Cancel</span></button><button class="ap-button primary blue" data-obj="launch"><i class="ap-icon-play"></i><span>Launch plan</span></button></div></div>` : ''}
    </section>`;
  }
  const list = [
    `<div class="obj-row"><div class="ag-ico"><i class="ap-icon-target"></i></div><div class="spacer"><div class="b">Spring collection launch</div><div class="muted xs">Maison Lune · 4 agents · ends May 31</div></div><span class="ap-status green">On track · step 4 of 6</span></div>`,
    O.launched ? `<div class="obj-row click" data-obj="open"><div class="ag-ico"><i class="ap-icon-target"></i></div><div class="spacer"><div class="b">${esc(O.text)}</div><div class="muted xs">Maison Lune · 4 agents · ends June 20</div></div><span class="ap-status ${runLabel()[0]}">${runLabel()[1]}</span><i class="ap-icon-chevron-right"></i></div>` : '',
  ].join('');
  return head + `<section class="ap-card pad"><div>${list}</div></section>
    ${canRun ? '' : `<div class="row muted xs"><i class="ap-icon-lock-on"></i><span>You need Publishing rights to start an objective.</span></div>`}
    ${canRun && !O.launched ? `<div class="row muted xs"><i class="ap-icon-sparkles"></i><span>Tip: press <span class="kbd">⌘K</span> and type "Launch the VivaTech campaign".</span></div>` : ''}`;
}

/* --- 5. command bar (⌘K) --- */
const CMDS = [
  { text:'Pause everything for Vélo Nord until Monday', re:/pause|stop|arr[eê]t/i, plan:()=>{
      if(!R().pause || !sees('velo')) return {deny:'You can only pause agents on clients you have access to.'};
      return { msg:'Pause the 2 agents working on Vélo Nord (Inbox and Listening) until Monday 9 am. Nothing will be sent in the meantime. An admin can resume them earlier.', ok:'Pause until Monday',
        run:()=>{ S.paused.velo = true; addLog({who:R().name, ag:false, act:'Paused Vélo Nord agents until Monday', profile:'velo-ig', res:'Done', why:'From the command bar.'}); snack('Vélo Nord agents paused until Monday'); } }; } },
  { text:'Show what agents sent alone yesterday', re:/show|sent|envoy|what|quoi|montre/i, plan:()=>({ go:()=>{ S.view='activity'; S.actFilter='agents'; S.agent=null; render(); snack('Showing what agents did'); } }) },
  { text:'Never reply to competitor accounts', re:/never|always|jamais|toujours|don.?t|rule|règle/i, plan:q=>{
      const txt = (q && /never|always|jamais|toujours|don.?t/i.test(q)) ? q : 'Never reply to competitor accounts';
      return { msg:`Add this rule for every client: "${txt}". All agents will follow it.${R().validateRules ? '' : ' An admin will review it first.'}`, ok:R().validateRules ? 'Add rule' : 'Suggest rule',
        run:()=>{ if(R().validateRules) PLAYBOOK.org.dont.push(txt); else (PLAYBOOK.org.pending ||= []).push({r:txt, from:'From the command bar, by '+R().name});
          S.view='playbook'; S.pb='org'; S.agent=null; snack(R().validateRules ? 'Rule added to the organization playbook' : 'Rule suggested to admins'); } }; } },
  { text:'Launch the VivaTech campaign for Maison Lune', re:/launch|campaign|campagne|vivatech|objective|lance/i, plan:q=>{
      if(!R().modules.includes('publishing') || !sees('lune')) return {deny:'You need Publishing rights on Maison Lune to launch a campaign.'};
      return { go:()=>{ S.view='objectives'; S.agent=null; S.obj.text = (q && q.length > 25 && /vivatech|campaign|campagne/i.test(q)) ? q.charAt(0).toUpperCase()+q.slice(1) : OBJ_TEXT; S.obj.phase='planning'; S.obj.note=null; S.obj.o={n:9, nets:'Instagram', start:'Today'}; render(); startPlanning(); } }; } },
  { text:'Approve all shipping questions on Maison Lune', re:/approve|valide|ship|livraison/i, plan:()=>{
      const d = S.decisions.find(x=>x.id==='d3');
      if(!d) return {deny:'Nothing left to approve on that.'};
      if(!canDecide(d)) return {deny:'You don\'t have Inbox rights on Maison Lune.'};
      return { msg:'Send the same reply to the 7 people asking about shipping to Belgium on @maisonlune. You can undo for 30 seconds.', ok:'Send 7 replies',
        run:()=>{ S.view='decisions'; S.agent=null; render(); resolve('d3', d.approveLog, true); } }; } },
];
S.cmd = {q:'', res:null};
function openCmd(){
  if(R().external){ snack('Not available for client approvers'); return; }
  S.cmd = {q:'', res:null}; $('cmdInput').value=''; $('cmdOverlay').hidden=false; renderCmd(); $('cmdInput').focus();
}
function closeCmd(){ $('cmdOverlay').hidden = true; }
const matches = q => q.trim() ? CMDS.filter(c=>c.re.test(q)) : CMDS;
function renderCmd(){
  const b = $('cmdBody'), res = S.cmd.res;
  if(res){
    b.innerHTML = res.deny
      ? `<div class="ap-infobox warning"><i class="ap-icon-warning"></i><div class="ap-infobox-content"><div class="ap-infobox-texts"><span class="ap-infobox-message">${esc(res.deny)}</span></div></div></div>
         <div class="dec-foot"><div class="acts"><button class="ap-button stroked grey" data-cmd="back"><span>Back</span></button></div></div>`
      : `<div class="why"><span class="b xs">Here is what I'll do</span><span>${esc(res.msg)}</span></div>
         <div class="dec-foot"><div class="acts"><button class="ap-button stroked grey" data-cmd="back"><span>Cancel</span></button><button class="ap-button primary blue" data-cmd="ok"><span>${esc(res.ok)}</span></button></div></div>`;
    return;
  }
  const q = S.cmd.q, m = matches(q);
  b.innerHTML = (q.trim() && !m.length ? `<p class="muted xs cmd-note">I can't do that in this prototype yet. Try one of these:</p>` : `<p class="muted xs cmd-note">${q.trim() ? 'Best match' : 'Try'}</p>`)
    + (m.length ? m : CMDS).map((c,i)=>`<div class="cmd-item${i===0 && q.trim() && m.length ? ' sel' : ''}" data-cmd-i="${CMDS.indexOf(c)}"><i class="ap-icon-sparkles"></i><span>${esc(c.text)}</span></div>`).join('');
}
function choose(c){ const p = c.plan(S.cmd.q.trim()); if(p.go){ closeCmd(); p.go(); return; } S.cmd.res = p; renderCmd(); }
$('cmdBtn').onclick = openCmd;
$('cmdInput').addEventListener('input', e=>{ S.cmd.q = e.target.value; S.cmd.res = null; renderCmd(); });
$('cmdInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault();
    if(S.cmd.res && S.cmd.res.run){ const run = S.cmd.res.run; closeCmd(); run(); render(); }
    else { const m = matches(S.cmd.q); if(m.length) choose(m[0]); } }
});
$('cmdOverlay').addEventListener('click', e=>{
  if(e.target.id==='cmdOverlay') return closeCmd();
  const it = e.target.closest('[data-cmd-i]'); if(it) return choose(CMDS[+it.dataset.cmdI]);
  const b = e.target.closest('[data-cmd]'); if(!b) return;
  if(b.dataset.cmd==='back'){ S.cmd.res = null; renderCmd(); $('cmdInput').focus(); }
  if(b.dataset.cmd==='ok'){ const run = S.cmd.res.run; closeCmd(); run(); render(); }
});

/* --- 6. same decision in Slack and on the phone --- */
function openSlack(){
  const vis = visibleDecisions();
  S.slackD = vis.find(x=>canDecide(x) && x.approve && x.draft && x.urgency==='high') || vis.find(x=>canDecide(x) && x.approve) || null;
  S.slackDone = null; renderSlack(); $('slackOverlay').hidden = false;
}
function renderSlack(){
  const d = S.slackD, p = d && PROFILES[d.profile];
  const urgent = visibleDecisions().filter(x=>x.urgency==='high' && canDecide(x)).length;
  $('slackBody').innerHTML = `
    <div class="sec-head"><div><h2 class="ap-h3">Same decision, where you already are</h2><p class="muted">Decisions also reach Slack, phones and AI assistants (MCP). Mission Control stays the record.</p></div>
      <span class="spacer"></span><button class="ap-icon-button" data-slack="close" aria-label="Close"><i class="ap-icon-close"></i></button></div>
    <div class="b">Slack · #social-team</div>
    <div class="ext-box">${d ? `
      <div class="row"><span class="ap-avatar size-32 square"><span class="ap-avatar-initials">A</span></span><span class="b">Agorapulse</span><span class="muted xs">10:42</span></div>
      <div><span class="b">${URG[d.urgency][1]} · ${esc(d.kind)}</span> on ${CLIENTS[p.client].name} ${p.net.charAt(0).toUpperCase()+p.net.slice(1)}</div>
      <div class="b">${esc(d.title)}</div>
      ${d.quote ? `<div class="quote">${esc(d.quote)}</div>` : ''}
      ${d.draft ? `<div class="draft"><div class="lbl muted xs b">Suggested reply</div>${esc(d.draft)}</div>` : ''}
      ${S.slackDone ? `<div class="row"><i class="ap-icon-rounded-check"></i><span>${esc(S.slackDone)}</span></div>`
        : `<div class="row"><button class="ap-button primary blue" data-slack="ok"><span>${d.approve}</span></button><button class="ap-button stroked grey" data-slack="open"><span>Open in Agorapulse</span></button></div>`}`
      : `<p class="muted">Nothing waiting for you.</p>`}</div>
    <div class="b">Phone notification</div>
    <div class="ext-box phone"><div class="row xs muted"><span class="b">Agorapulse</span><span class="spacer"></span><span>now</span></div>
      <div class="b">${urgent} urgent decision${urgent===1?'':'s'}</div><div class="muted">${d ? esc(d.title) : 'All caught up'}</div></div>`;
}
$('slackOverlay').addEventListener('click', e=>{
  if(e.target.id==='slackOverlay'){ $('slackOverlay').hidden = true; return; }
  const b = e.target.closest('[data-slack]'); if(!b) return; const a = b.dataset.slack, d = S.slackD;
  if(a==='close') $('slackOverlay').hidden = true;
  if(a==='open'){ $('slackOverlay').hidden = true; S.view='decisions'; render(); $('card-'+d.id)?.scrollIntoView({block:'center'}); }
  if(a==='ok' && S.decisions.includes(d)){ S.slackDone = `${d.approveLog} by ${R().name} from Slack. Logged in Mission Control.`; resolve(d.id, d.approveLog+' (from Slack)', false); renderSlack(); }
});

/* --- 7. keyboard --- */
document.addEventListener('keydown', e=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('cmdOverlay').hidden ? openCmd() : closeCmd(); return; }
  if(e.key==='Escape'){ closeCmd(); $('slackOverlay').hidden = true; $('whoMenu').hidden = true; return; }
  const tg = e.target;
  if(tg.tagName==='INPUT' || tg.tagName==='TEXTAREA'){
    if(e.key==='Enter' && !e.shiftKey){
      if(tg.dataset.steer){ e.preventDefault(); steer(tg.dataset.steer, tg.value); }
      else if(tg.dataset.ans){ e.preventDefault(); answer(tg.dataset.ans, tg.value); }
      else if(tg.dataset.planSteer!==undefined){ e.preventDefault(); planSteer(tg.value); }
    }
    return;
  }
  if(!$('cmdOverlay').hidden || !$('slackOverlay').hidden || S.view!=='decisions' || R().external || !R().modules.length || e.metaKey || e.ctrlKey) return;
  const ids = S.curList || []; if(!ids.length) return;
  const k = e.key.toLowerCase();
  if(k==='j' || k==='k'){ S.focus = Math.max(0, Math.min(ids.length-1, S.focus + (k==='j' ? 1 : -1))); render(); $('card-'+ids[S.focus])?.scrollIntoView({block:'nearest', behavior:'smooth'}); return; }
  const d = S.decisions.find(x=>x.id===ids[S.focus]); if(!d || !canDecide(d)) return;
  if(k==='a' && d.approve) resolve(d.id, d.approveLog, d.undo);
  if(k==='r'){ S.rejecting[d.id] = true; render(); }
  if(k==='e' && d.draft){ e.preventDefault(); S.editing[d.id] = true; render(); $('ed-'+d.id)?.focus(); }
});

render();
</script>
</body>
